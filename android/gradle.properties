org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# La ruta del proyecto contiene "ó" (Programación). El Android Gradle Plugin
# advierte sobre caracteres no-ASCII en la ruta; este flag desactiva esa
# verificación ya que en la práctica el build funciona correctamente.
android.overridePathCheck=true
